name: Update postcat formula

on:
  repository_dispatch:
    types: [postcat-release]
  workflow_dispatch:
    inputs:
      version:
        description: postcat release version (without the v prefix)
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          version="$DISPATCH_VERSION"
          if [ -z "$version" ]; then version="$MANUAL_VERSION"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/egoist/postcat/releases/download/v${VERSION}"
          arm="postcat-${VERSION}-aarch64-apple-darwin.tar.gz"
          intel="postcat-${VERSION}-x86_64-apple-darwin.tar.gz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$arm" "$base/$arm"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$intel" "$base/$intel"
          arm_sha=$(sha256sum "$RUNNER_TEMP/$arm" | cut -d ' ' -f1)
          intel_sha=$(sha256sum "$RUNNER_TEMP/$intel" | cut -d ' ' -f1)

          cat > Formula/postcat.rb <<EOF
          class Postcat < Formula
            desc "Keyboard-first API client in your terminal"
            homepage "https://github.com/egoist/postcat"
            version "${VERSION}"

            # Installed as \`pcat\` because \`postcat\` is already the name of a
            # command that ships with Postfix (used to view mail queue files),
            # so this formula must not shadow/conflict with it.

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/${arm}"
                sha256 "${arm_sha}"

                define_method(:install) do
                  bin.install "postcat" => "pcat"
                end
              end

              if Hardware::CPU.intel?
                url "${base}/${intel}"
                sha256 "${intel_sha}"

                define_method(:install) do
                  bin.install "postcat" => "pcat"
                end
              end
            end

            test do
              # postcat is a full-screen TUI with no CLI flags/subcommands, so there is
              # nothing sensible to invoke non-interactively; just confirm it installed.
              assert_path_exists bin/"pcat"
              assert_predicate bin/"pcat", :executable?
            end
          end
          EOF

      - name: Commit formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/postcat.rb
          git commit -m "postcat ${VERSION}" || exit 0
          git push
